# electron-builder config. Build with `npm run dist` (this machine) or `npm run dist:mac` / `dist:win`.
# See README "Build it yourself" and .github/workflows/build.yml.
appId: com.acidgorgon.rbxforge
productName: RBX Forge
copyright: Copyright © 2026 Acidgorgon
artifactName: RBX-Forge-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# The app is the electron-vite output. Production dependencies (the Claude Agent SDK, MCP SDK, zod)
# are added from node_modules by electron-builder; React/Monaco are bundled into out/renderer.
files:
  - out/**/*
  - "!out/**/*.map"
  - "!**/node_modules/**/{README,CHANGELOG,HISTORY}.md"
  - "!**/node_modules/**/*.{d.ts,d.mts,d.cts,map}"
  # node-pty: ship lib/ and the native binaries only (not its C++ sources, winpty/conpty sources,
  # build intermediates or Windows debug symbols).
  - "!node_modules/node-pty/{deps,src,third_party,scripts,typings}/**"
  - "!node_modules/node-pty/build/{deps,node_gyp_bins}/**"
  - "!node_modules/node-pty/build/Release/{obj,obj.target,.deps}/**"
  - "!node_modules/node-pty/**/*.{pdb,gyp,gypi,mk}"
  - "!node_modules/node-pty/build/Makefile"
  - "!node_modules/node-pty/{node-addon-api,build/node-addon-api}/**"
  - "!node_modules/node-pty/lib/**/*.test.js"
  - "!node_modules/node-addon-api/**"

# The Agent SDK runs a native CLI from @anthropic-ai/claude-agent-sdk-<platform>-<arch>. Executables
# cannot run from inside app.asar, so those packages are unpacked; the app passes the unpacked path
# to the SDK (src/main/services/sdkBinary.ts). build/afterPack.cjs keeps only the target's binary.
asar: true
asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # Integrated terminal: pty.node / conpty.node, the macOS spawn-helper and the Windows conpty
  # worker script must be real files (src/main/services/terminal/backend.ts).
  - "node_modules/node-pty/**"
afterPack: build/afterPack.cjs

# The Lune test runtime (Luau files) is read from disk by lune, so it ships outside the asar
# (services/tests/lune.ts findRuntimeDir looks in process.resourcesPath/lune).
extraResources:
  - from: resources/lune
    to: lune
  # The Forge Bridge Studio plugin source (services/studio/wire.ts installs it into Studio's plugins folder).
  - from: resources/studio
    to: studio
  # The target's rokit binary (build/rokit-binaries.mjs downloads it; ${os} is mac|win|linux).
  # First launch runs `rokit self-install` from it (src/main/services/setup/toolchain.ts), and
  # build/afterPack.cjs fails the build if it is missing.
  - from: resources/rokit/${os}-${arch}
    to: rokit
    filter: ["rokit", "rokit.exe"]

# No rebuild for Electron: the only native module, node-pty 1.1.0, is an N-API addon (ABI-stable
# across Node and Electron) that ships prebuilds for darwin-arm64/x64 and win32-x64/arm64 in
# node_modules/node-pty/prebuilds/<platform>-<arch>, all of which npm ci installs on any host. A
# rebuild would compile it from source for the runner's toolchain, which breaks the win32-arm64
# cross-build on the x64 runner. build/afterPack.cjs keeps only the target's prebuild and fails the
# build if it is missing. (Linux has no prebuild; npm install compiles build/Release/pty.node.)
npmRebuild: false
# Smaller dmg/zip/installer; most of the size is the ~250 MB Agent SDK CLI.
compression: maximum
electronLanguages: [en, en-US, en-GB]

# Targets name no arch: an arch list here would override the CLI's --arm64/--x64, so every CI job
# would build every arch (and fail afterPack for the arch whose SDK CLI it did not fetch). The arch
# comes from the command line (package.json dist:mac / dist:win, build.yml) or defaults to the host.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc signature ("-") so the app runs on Apple Silicon without a Developer ID certificate.
  # It is not notarized: first launch needs right-click > Open (see README). With a real certificate,
  # set identity (or CSC_LINK), hardenedRuntime: true and notarize.
  identity: "-"
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Keep the Agent SDK CLI's own (Anthropic) signature instead of re-signing it ad hoc.
  signIgnore:
    - "claude-agent-sdk-darwin-[^/]+/claude$"
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Acidgorgon

dmg:
  title: ${productName} ${version}
  writeUpdateInfo: false

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: RBX Forge
  uninstallDisplayName: RBX Forge
  deleteAppDataOnUninstall: false
  # differentialPackage (default on) writes RBX-Forge-*.exe.blockmap next to the installer, so
  # electron-updater can download only the changed blocks of a new version.

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  icon: build/icon.png

# Self-update feed (electron-updater, src/main/services/updater). electron-builder writes these
# into the app as resources/app-update.yml and writes latest.yml / latest-mac.yml (+ .blockmap
# files) next to the installers. It never uploads anything: CI runs it with --publish never and
# the release job of .github/workflows/build.yml uploads the files (see README "Updates").
# The app reads releases anonymously, so this repository must be public. To keep the source
# private, publish releases to a public binaries-only repo and change `repo` (one line), e.g.
#   repo: rbx-forge-releases
publish:
  provider: github
  owner: Acidgorgon
  repo: rbx-forge
